name: day-trader

on:
  push:
    paths:
      - "day-trader/**"
      - ".github/workflows/day-trader.yml"
  pull_request:
    paths:
      - "day-trader/**"
      - ".github/workflows/day-trader.yml"

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: day-trader
    env:
      # actions/setup-python has no 3.9 build for current Ubuntu runner images; uv's
      # standalone interpreters still cover the pack's oldest supported Python.
      PY: uv run --no-project --python ${{ matrix.python-version }} python
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Vendored trader_common.py copies match shared/
        run: $PY tools/sync_common.py --check
      - name: Unit tests (offline, standard library only)
        run: $PY -m unittest discover -s tests
      - name: SKILL.md frontmatter
        run: $PY tools/package_skills.py --check
